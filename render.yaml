services:
  - name: idat7215-pawthfinder-demo
    type: web
    runtime: docker
    branch: main
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PAWTH_DATA_DIR
        value: /tmp/pawthfinder-demo
      - key: PAWTH_TEMPORARY_RECORDS
        value: "1"
      - key: PAWTH_SECRET
        generateValue: true
      - key: PAWTH_BEHIND_PROXY
        value: "1"
      - key: PAWTH_SECURE_COOKIES
        value: "1"
      - key: PAWTH_REQUIRE_MODEL
        value: "1"
      - key: PAWTH_ALLOW_TRAINING
        value: "0"
      - key: PAWTH_PAGES_ORIGIN
        value: https://bruce666-ppp.github.io
